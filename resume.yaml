# Match profile. This is the only file you edit to change ranking behaviour.
# Edit, then re-run `python score.py` (or hit Fetch now in the dashboard).
#
# target_titles / exclude_titles / exclude_description / locations are REGEX,
# matched case-insensitively. keywords are LITERAL terms, matched on word
# boundaries, so "c++" and "ci/cd" work as written.

profile:
  name: Eric Chiu
  email: ericchiu0228@gmail.com # also sent as the USAJOBS User-Agent

match:
  # title_score = max weight of any matching pattern (0-10), then x3 in the
  # total. No match at all drops the job. Order does not matter.
  target_titles:
    # Entry-level and internship markers score highest -- title is tripled, so
    # these outrank an equally-matching mid-level posting by a wide margin.
    - { pattern: "(intern|internship|co-?op)\\b.*(engineer|cloud|it|support|devops|technical)", weight: 10 }
    - { pattern: "(engineer|cloud|it|support|devops|technical).*\\b(intern|internship|co-?op)\\b", weight: 10 }
    - { pattern: "(new ?grad|university grad|campus|early career|rotational)", weight: 10 }
    - { pattern: "(entry.?level|associate|junior|jr\\.?)\\s*(cloud|support|devops|systems?|network|it|technical|sre|platform)", weight: 10 }
    - { pattern: "cloud support (engineer|associate)", weight: 10 }
    - { pattern: "technical support engineer", weight: 9 }
    - { pattern: "(help ?desk|service desk|desktop support|it support)", weight: 8 }
    - { pattern: "support engineer", weight: 8 }
    - { pattern: "cloud (engineer|operations|ops)", weight: 8 }
    - { pattern: "devops engineer", weight: 8 }
    - { pattern: "site reliability engineer|\\bsre\\b", weight: 8 }
    - { pattern: "platform engineer", weight: 7 }
    - { pattern: "infrastructure engineer", weight: 7 }
    - { pattern: "systems? (engineer|administrator)", weight: 6 }
    - { pattern: "linux (engineer|administrator|admin)", weight: 6 }
    - { pattern: "network engineer", weight: 5 }
    - { pattern: "solutions architect", weight: 5 }
    - { pattern: "technical account manager", weight: 5 }
    - { pattern: "noc (engineer|technician)", weight: 4 }

  # Dropped before scoring.
  exclude_titles:
    - "\\b(director|vp|vice president|head of|chief|principal)\\b"
    # NOTE: internships are deliberately NOT excluded -- they are a target.
    - "\\b(senior|sr\\.?|staff|lead)\\b"
    - "\\b(sales|account executive|recruiter|marketing)\\b"
    - "(front.?end|ui|ux|mobile|ios|android|game) (developer|engineer)"
    - "\\b(data scientist|machine learning|ml engineer)\\b"
    - "\\bmanager\\b(?!.*technical account)"

  exclude_description:
    - "(active|current)\\s+(ts/sci|top secret|secret)\\s+clearance"
    - "\\bpolygraph\\b"
    - "must (be able to )?(work|reside) (on.?site|in.?person) in (?!.*remote)"
    - "\\bunpaid\\b"
    - "\\b(5|6|7|8|9|10|12|15)\\+? years"
    - "\\b(deep|extensive|expert.level) experience\\b"

  # keyword_score = sum of the weights of terms found in title+description,
  # each term counted once, capped at 30.
  keywords:
    strong:
      aws: 5
      linux: 4
      troubleshooting: 4
      networking: 3
      terraform: 3
      kubernetes: 3
      python: 3
      docker: 3
      ec2: 2
      s3: 2
      vpc: 2
      iam: 2
      cloudwatch: 2
      bash: 2
      ci/cd: 2
      "on-call": 2
    nice:
      dns: 1
      tcp/ip: 1
      ansible: 1
      jenkins: 1
      github actions: 1
      lambda: 1
      rds: 1
      s3 bucket: 1
      monitoring: 1
      incident response: 1
      sql: 1
      git: 1
      customer facing: 1
      zendesk: 1
      "certification": 1
      route 53: 1
      load balancer: 1
      postmortem: 1

    # Each present term costs -2, capped at -6 total, and is surfaced as an
    # amber chip so you can see what you would be walking into.
    gaps:
      - java
      - c++
      - golang
      - scala
      - kafka
      - hadoop
      - salesforce
      - sap
      - "active directory"
      - vmware
      - oracle dba

  # location_score = max weight of any matching entry (0-10).
  # A job with remote=1 automatically scores the "Remote (US)" entry.
  locations:
    - { pattern: "Remote \\(US\\)", weight: 10 }
    - { pattern: "boston|cambridge|somerville|waltham|burlington, ma", weight: 9 }
    - { pattern: "massachusetts|\\bma\\b", weight: 7 }
    - { pattern: "new hampshire|\\bnh\\b|nashua|manchester", weight: 5 }
    - { pattern: "rhode island|\\bri\\b|providence", weight: 4 }
    - { pattern: "connecticut|\\bct\\b", weight: 3 }

  # --- experience and geography: hard filters, not score components ---------
  # A job wanting more years than this is dropped. Postings that state no
  # requirement are always kept, so this does not silently hide the many JDs
  # that never name a number. Raise it to widen the net.
  max_years_experience: 2

  # Which seniority bands to keep. Parsed from the title, then the JD.
  # Drop "mid" from this list to go internship/entry only.
  levels:
    - internship
    - entry
    - mid

  # ISO-2 codes. Greenhouse and Lever boards return roles worldwide, so
  # without this a London posting can reach your daily ten on title alone.
  # Empty list = allow everywhere.
  countries:
    - US

  # salary_max below this earns a -5 penalty. Jobs with no salary data are
  # not penalised -- most postings omit it. Interns and entry roles pay less,
  # so this is deliberately low; raise it once you are targeting full-time.
  salary_floor: 45000

  # Adzuna queries: one call per title, top N by weight. Keep under the quota.
  search:
    where: "Boston, MA"
    max_titles: 6
    distance_km: 80
